[project]
name = "dp-servers-common"
version = "0.1.0"
description = "Shared model-server framework for the DP rebuild (Stage B): HTTP skeleton, /health identity, warmup, wire schemas."
requires-python = ">=3.12"
# Version pins live in each server's requirements.txt (each server owns its venv);
# these are the abstract dependencies of the framework itself.
dependencies = [
    "fastapi",
    "pydantic>=2",
    "uvicorn",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dp_servers_common"]
